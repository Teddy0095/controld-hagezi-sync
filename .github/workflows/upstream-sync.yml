name: 🔄 Upstream Sync

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_OWNER: "0x11DFE"
  UPSTREAM_REPOSITORY: "controld-hagezi-sync"
  UPSTREAM_URL: "https://github.com/0x11DFE/controld-hagezi-sync.git"
  UPSTREAM_BRANCH: "main"

  TARGET_BRANCH: "main"
  SYNC_BRANCH: "automation/upstream-sync"

  PROTECTED_CONFIG: "config.toml"
  PROTECTED_WORKFLOW: ".github/workflows/upstream-sync.yml"

jobs:
  sync:
    name: 🔄 Synchronize upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    defaults:
      run:
        shell: bash

    steps:

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          clean: true
          submodules: false
          lfs: false

      - name: ⚙️ Configure Git
        run: |
          set -euo pipefail

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --local core.pager cat
          git config --local pager.diff false
          git config --local pager.log false
          git config --local advice.detachedHead false
          git config --local credential.helper ""

          echo "✅ Git configured."

      - name: 🔐 Verify upstream identity
        run: |
          set -euo pipefail

          EXPECTED_URL="https://github.com/0x11DFE/controld-hagezi-sync.git"

          echo "=========================================="
          echo "UPSTREAM OWNER      = [$UPSTREAM_OWNER]"
          echo "UPSTREAM REPOSITORY = [$UPSTREAM_REPOSITORY]"
          echo "UPSTREAM URL        = [$UPSTREAM_URL]"
          echo "UPSTREAM BRANCH     = [$UPSTREAM_BRANCH]"
          echo "EXPECTED URL        = [$EXPECTED_URL]"
          echo "=========================================="

          [[ "$UPSTREAM_OWNER" == "0x11DFE" ]] || {
            echo "::error::Invalid upstream owner"
            exit 1
          }

          [[ "$UPSTREAM_REPOSITORY" == "controld-hagezi-sync" ]] || {
            echo "::error::Invalid upstream repository"
            exit 1
          }

          [[ "$UPSTREAM_BRANCH" == "main" ]] || {
            echo "::error::Invalid upstream branch"
            exit 1
          }

          [[ "$UPSTREAM_URL" == "$EXPECTED_URL" ]] || {
            echo "::error::Configured upstream URL does not match trusted identity"
            echo "::error::Expected: $EXPECTED_URL"
            echo "::error::Configured: $UPSTREAM_URL"
            exit 1
          }

          echo "✅ Trusted upstream identity verified."

      - name: 🌐 Fetch and pin revisions
        run: |
          set -euo pipefail

          FORK_REF="refs/remotes/origin/${TARGET_BRANCH}"
          UPSTREAM_REF="refs/remotes/upstream/${UPSTREAM_BRANCH}"

          echo "Fetching fork..."

          git fetch \
            --no-tags \
            --prune \
            origin \
            "refs/heads/${TARGET_BRANCH}:${FORK_REF}"

          echo "Fetching upstream..."

          git fetch \
            --no-tags \
            --prune \
            "$UPSTREAM_URL" \
            "refs/heads/${UPSTREAM_BRANCH}:${UPSTREAM_REF}"

          FORK_COMMIT="$(git rev-parse "$FORK_REF")"
          UPSTREAM_COMMIT="$(git rev-parse "$UPSTREAM_REF")"
          UPSTREAM_TREE="$(git rev-parse "${UPSTREAM_COMMIT}^{tree}")"

          [[ "$FORK_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid fork commit SHA"
            exit 1
          }

          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid upstream commit SHA"
            exit 1
          }

          [[ "$UPSTREAM_TREE" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid upstream tree SHA"
            exit 1
          }

          [[ "$(git cat-file -t "$FORK_COMMIT")" == "commit" ]] || {
            echo "::error::Fork object is not a commit"
            exit 1
          }

          [[ "$(git cat-file -t "$UPSTREAM_COMMIT")" == "commit" ]] || {
            echo "::error::Upstream object is not a commit"
            exit 1
          }

          [[ "$(git cat-file -t "$UPSTREAM_TREE")" == "tree" ]] || {
            echo "::error::Upstream object is not a tree"
            exit 1
          }

          printf '%s\n' "$FORK_COMMIT" > "$RUNNER_TEMP/fork-commit"
          printf '%s\n' "$UPSTREAM_COMMIT" > "$RUNNER_TEMP/upstream-commit"
          printf '%s\n' "$UPSTREAM_TREE" > "$RUNNER_TEMP/upstream-tree"

          echo "Fork commit:     $FORK_COMMIT"
          echo "Upstream commit: $UPSTREAM_COMMIT"
          echo "Upstream tree:   $UPSTREAM_TREE"

          echo "✅ Revisions pinned."

      - name: 🧹 Reset workspace
        run: |
          set -euo pipefail

          FORK_COMMIT="$(cat "$RUNNER_TEMP/fork-commit")"

          git reset --hard "$FORK_COMMIT"
          git clean -ffdx

          [[ "$(git rev-parse HEAD)" == "$FORK_COMMIT" ]] || {
            echo "::error::Workspace does not match fork"
            exit 1
          }

          echo "✅ Workspace matches trusted fork."

      - name: 🛡️ Save fork-owned files
        run: |
          set -euo pipefail

          PROTECTED_DIR="$RUNNER_TEMP/protected"

          rm -rf "$PROTECTED_DIR"
          mkdir -p "$PROTECTED_DIR"

          [[ -f "$PROTECTED_CONFIG" ]] || {
            echo "::error::config.toml is missing"
            exit 1
          }

          [[ ! -L "$PROTECTED_CONFIG" ]] || {
            echo "::error::config.toml is a symlink"
            exit 1
          }

          [[ -f "$PROTECTED_WORKFLOW" ]] || {
            echo "::error::upstream-sync.yml is missing"
            exit 1
          }

          [[ ! -L "$PROTECTED_WORKFLOW" ]] || {
            echo "::error::upstream-sync.yml is a symlink"
            exit 1
          }

          CONFIG_MODE="$(git ls-files --stage -- "$PROTECTED_CONFIG" | awk '{print $1}')"
          WORKFLOW_MODE="$(git ls-files --stage -- "$PROTECTED_WORKFLOW" | awk '{print $1}')"

          [[ "$CONFIG_MODE" == "100644" ]] || {
            echo "::error::Unexpected config.toml mode: $CONFIG_MODE"
            exit 1
          }

          [[ "$WORKFLOW_MODE" == "100644" ]] || {
            echo "::error::Unexpected workflow mode: $WORKFLOW_MODE"
            exit 1
          }

          install -m 600 "$PROTECTED_CONFIG" \
            "$PROTECTED_DIR/config.toml"

          install -m 600 "$PROTECTED_WORKFLOW" \
            "$PROTECTED_DIR/upstream-sync.yml"

          echo "✅ Fork-owned files saved."

      - name: 📦 Import upstream tree
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"
          PROTECTED_DIR="$RUNNER_TEMP/protected"

          echo "Importing upstream commit:"
          echo "$UPSTREAM_COMMIT"

          git read-tree --reset -u "$UPSTREAM_COMMIT"

          rm -f -- "$PROTECTED_CONFIG"
          rm -f -- "$PROTECTED_WORKFLOW"

          if [[ -e ".github" && ! -d ".github" ]]; then
            echo "::error::.github is not a directory"
            exit 1
          fi

          [[ ! -L ".github" ]] || {
            echo "::error::.github is a symlink"
            exit 1
          }

          mkdir -p ".github/workflows"

          [[ ! -L ".github/workflows" ]] || {
            echo "::error::.github/workflows is a symlink"
            exit 1
          }

          install -m 600 \
            "$PROTECTED_DIR/config.toml" \
            "$PROTECTED_CONFIG"

          install -m 600 \
            "$PROTECTED_DIR/upstream-sync.yml" \
            "$PROTECTED_WORKFLOW"

          echo "✅ Upstream imported."
          echo "✅ Fork-owned files restored."

      - name: 🔐 Verify protected files
        run: |
          set -euo pipefail

          PROTECTED_DIR="$RUNNER_TEMP/protected"

          cmp -s \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_DIR/config.toml" || {
              echo "::error::config.toml was modified"
              exit 1
            }

          cmp -s \
            "$PROTECTED_WORKFLOW" \
            "$PROTECTED_DIR/upstream-sync.yml" || {
              echo "::error::upstream-sync.yml was modified"
              exit 1
            }

          echo "✅ Protected files verified byte-for-byte."

      - name: 🧱 Verify workflow boundary
        run: |
          set -euo pipefail

          WORKFLOW=".github/workflows/upstream-sync.yml"

          [[ -f "$WORKFLOW" ]] || {
            echo "::error::upstream-sync.yml is missing"
            exit 1
          }

          [[ ! -L "$WORKFLOW" ]] || {
            echo "::error::upstream-sync.yml is a symlink"
            exit 1
          }

          grep -q '^name:' "$WORKFLOW" || {
            echo "::error::upstream-sync.yml does not contain a workflow name"
            exit 1
          }

          grep -q '^on:' "$WORKFLOW" || {
            echo "::error::upstream-sync.yml does not contain an on section"
            exit 1
          }

          grep -q '^jobs:' "$WORKFLOW" || {
            echo "::error::upstream-sync.yml does not contain jobs"
            exit 1
          }

          echo "Existing workflows are allowed:"
          find .github/workflows \
            -maxdepth 1 \
            -type f \
            -printf '  %f\n' |
            sort

          echo "✅ Workflow boundary verified."

      - name: 🧬 Verify final tree against upstream
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          UPSTREAM_LIST="$RUNNER_TEMP/upstream-tree-list"
          FINAL_LIST="$RUNNER_TEMP/final-tree-list"

          git ls-tree -r --full-tree "$UPSTREAM_COMMIT" |
            awk '
              $4 != "config.toml" &&
              $4 != ".github/workflows/upstream-sync.yml" {
                print
              }
            ' |
            sort > "$UPSTREAM_LIST"

          git ls-files --stage |
            awk '
              $4 != "config.toml" &&
              $4 != ".github/workflows/upstream-sync.yml" {
                mode = $1
                object = $2

                if (mode == "160000") {
                  type = "commit"
                } else {
                  type = "blob"
                }

                print mode " " type " " object "\t" $4
              }
            ' |
            sort > "$FINAL_LIST"

          if ! cmp -s "$UPSTREAM_LIST" "$FINAL_LIST"; then
            echo "::error::Non-protected tree differs from upstream"

            echo
            echo "Differences:"
            diff -u "$UPSTREAM_LIST" "$FINAL_LIST" || true

            exit 1
          fi

          echo "✅ Non-protected tree matches upstream."

      - name: 🧪 Static validation
        run: |
          set -euo pipefail

          FILE="sync-hagezi.sh"

          [[ -f "$FILE" ]] || {
            echo "::error::sync-hagezi.sh is missing"
            exit 1
          }

          [[ ! -L "$FILE" ]] || {
            echo "::error::sync-hagezi.sh is a symlink"
            exit 1
          }

          MODE="$(git ls-files --stage -- "$FILE" | awk '{print $1}')"

          [[ "$MODE" == "100755" ]] || {
            echo "::error::sync-hagezi.sh must have mode 100755; found $MODE"
            exit 1
          }

          echo "Running bash syntax check only..."

          bash -n "$FILE"

          echo "✅ Bash syntax check passed."
          echo "ℹ️ sync-hagezi.sh was NOT executed."

      - name: 🔎 Final validation
        run: |
          set -euo pipefail

          FORK_COMMIT="$(cat "$RUNNER_TEMP/fork-commit")"
          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"
          EXPECTED_TREE="$(cat "$RUNNER_TEMP/upstream-tree")"

          [[ -z "$(git ls-files --unmerged)" ]] || {
            echo "::error::Unmerged Git entries detected"
            exit 1
          }

          git ls-files --error-unmatch \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_WORKFLOW" \
            >/dev/null

          ACTUAL_TREE="$(git rev-parse "${UPSTREAM_COMMIT}^{tree}")"

          [[ "$ACTUAL_TREE" == "$EXPECTED_TREE" ]] || {
            echo "::error::Upstream tree changed"
            exit 1
          }

          git diff --check "$FORK_COMMIT" -- .

          echo "=========================================="
          echo "FINAL VALIDATION"
          echo "=========================================="
          echo "Fork commit:     $FORK_COMMIT"
          echo "Upstream commit: $UPSTREAM_COMMIT"
          echo "Upstream tree:   $EXPECTED_TREE"
          echo "=========================================="
          echo "✅ Final validation passed."

      - name: 🔎 Check for changes
        id: changes
        run: |
          set -euo pipefail

          git add --all

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "=========================================="
            echo "NO SYNCHRONIZATION CHANGES"
            echo "=========================================="
            echo "Upstream and fork are already synchronized."

            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "SYNCHRONIZATION CHANGES FOUND"
          echo "=========================================="

          git diff --cached --stat

          echo
          echo "Changed files:"
          git diff --cached --name-status

      - name: 📝 Commit synchronization
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          git commit \
            -m "Sync with upstream" \
            -m "Upstream commit: $UPSTREAM_COMMIT"

          echo "✅ Synchronization commit created."

      - name: 🚀 Push synchronization branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push \
            --force-with-lease \
            origin \
            "HEAD:${SYNC_BRANCH}"

          echo "✅ Synchronization branch pushed."

      - name: 🔀 Create or update Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FORK_COMMIT="$(cat "$RUNNER_TEMP/fork-commit")"
          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"
          UPSTREAM_TREE="$(cat "$RUNNER_TEMP/upstream-tree")"

          EXISTING_PR="$(
            gh pr list \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"

          PR_TITLE="🔄 Sync with upstream"

          PR_BODY="$(
            cat <<EOF
          ## 🔄 Upstream synchronization

          Automatically generated synchronization PR.

          ### Trusted upstream

          \`$UPSTREAM_URL\`

          ### Pinned revisions

          - Fork: \`$FORK_COMMIT\`
          - Upstream: \`$UPSTREAM_COMMIT\`
          - Upstream tree: \`$UPSTREAM_TREE\`

          ### Fork-owned files

          - \`config.toml\`
          - \`.github/workflows/upstream-sync.yml\`

          ### Validation

          - Trusted upstream identity verified
          - Upstream commit pinned
          - Upstream tree pinned
          - Protected files preserved
          - Protected files verified
          - Existing workflows allowed
          - Non-protected tree compared with upstream
          - Bash syntax checked
          - Upstream script was NOT executed
          - Upstream tests were NOT executed
          - Upstream builds were NOT executed
          - Upstream dependencies were NOT installed

          ### Review

          This PR is **not automatically merged**.
          Review the changes before merging into \`main\`.
          EOF
          )"

          if [[ -n "$EXISTING_PR" ]]; then
            echo "Updating existing PR #$EXISTING_PR"

            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          else
            echo "Creating new Pull Request"

            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi

          echo "✅ Pull Request ready."

      - name: ✨ Complete
        if: steps.changes.outputs.changed == 'false'
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "✨ UPSTREAM SYNC COMPLETE"
          echo "=========================================="
          echo "No changes were required."
