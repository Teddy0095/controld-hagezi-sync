name: Upstream Sync

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream and create PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      UPSTREAM_URL: https://github.com/0x11DFE/controld-hagezi-sync.git
      UPSTREAM_BRANCH: main
      TARGET_BRANCH: main
      SYNC_BRANCH: automation/upstream-sync

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify upstream
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_URL="https://github.com/0x11DFE/controld-hagezi-sync.git"

          if [[ "$UPSTREAM_URL" != "$EXPECTED_URL" ]]; then
            echo "::error::Wrong upstream URL"
            echo "Expected: $EXPECTED_URL"
            echo "Configured: $UPSTREAM_URL"
            exit 1
          fi

          echo "Upstream verified:"
          echo "$UPSTREAM_URL"

      - name: Fetch repositories
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin "$TARGET_BRANCH"

          git fetch \
            --prune \
            "$UPSTREAM_URL" \
            "$UPSTREAM_BRANCH"

          FORK_COMMIT="$(git rev-parse "origin/$TARGET_BRANCH")"
          UPSTREAM_COMMIT="$(git rev-parse FETCH_HEAD)"

          [[ "$FORK_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid fork commit"
            exit 1
          }

          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid upstream commit"
            exit 1
          }

          printf '%s\n' "$FORK_COMMIT" \
            > "$RUNNER_TEMP/fork-commit"

          printf '%s\n' "$UPSTREAM_COMMIT" \
            > "$RUNNER_TEMP/upstream-commit"

          echo "Fork commit:"
          echo "$FORK_COMMIT"

          echo "Upstream commit:"
          echo "$UPSTREAM_COMMIT"

      - name: Save fork files
        shell: bash
        run: |
          set -euo pipefail

          git reset --hard "origin/$TARGET_BRANCH"

          [[ -f config.toml ]] || {
            echo "::error::config.toml does not exist"
            exit 1
          }

          [[ -f .github/workflows/upstream-sync.yml ]] || {
            echo "::error::upstream-sync.yml does not exist"
            exit 1
          }

          cp -- \
            config.toml \
            "$RUNNER_TEMP/config.toml"

          cp -- \
            .github/workflows/upstream-sync.yml \
            "$RUNNER_TEMP/upstream-sync.yml"

          echo "Fork-owned files saved."

      - name: Import upstream
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          git read-tree --reset -u "$UPSTREAM_COMMIT"

          rm -f -- config.toml
          rm -f -- .github/workflows/upstream-sync.yml

          mkdir -p .github/workflows

          cp -- \
            "$RUNNER_TEMP/config.toml" \
            config.toml

          cp -- \
            "$RUNNER_TEMP/upstream-sync.yml" \
            .github/workflows/upstream-sync.yml

          echo "Upstream imported."

      - name: Verify fork files
        shell: bash
        run: |
          set -euo pipefail

          cmp -s \
            config.toml \
            "$RUNNER_TEMP/config.toml" || {
              echo "::error::config.toml was changed"
              exit 1
            }

          cmp -s \
            .github/workflows/upstream-sync.yml \
            "$RUNNER_TEMP/upstream-sync.yml" || {
              echo "::error::upstream-sync.yml was changed"
              exit 1
            }

          echo "Protected files verified."

      - name: Validate sync script
        shell: bash
        run: |
          set -euo pipefail

          [[ -f sync-hagezi.sh ]] || {
            echo "::error::sync-hagezi.sh is missing"
            exit 1
          }

          [[ ! -L sync-hagezi.sh ]] || {
            echo "::error::sync-hagezi.sh is a symlink"
            exit 1
          }

          MODE="$(
            git ls-files --stage -- sync-hagezi.sh |
            awk '{print $1}'
          )"

          [[ "$MODE" == "100755" ]] || {
            echo "::error::sync-hagezi.sh must be executable"
            echo "Git mode: $MODE"
            exit 1
          }

          bash -n sync-hagezi.sh

          echo "Static validation passed."
          echo "Upstream script was NOT executed."

      - name: Check changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No synchronization changes."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo "Changes detected:"
          git diff --cached --name-status

      - name: Commit synchronization
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          git commit \
            -m "Sync with upstream" \
            -m "Upstream commit: ${UPSTREAM_COMMIT}"

      - name: Push sync branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git push \
            --force-with-lease \
            origin \
            "HEAD:${SYNC_BRANCH}"

      - name: Create or update Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          EXISTING_PR="$(
            gh pr list \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          PR_TITLE="Sync with upstream"

          PR_BODY="$(
            cat <<EOF
          ## Upstream synchronization

          Automatically generated synchronization PR.

          Upstream:
          \`$UPSTREAM_URL\`

          Upstream commit:
          \`$UPSTREAM_COMMIT\`

          Protected fork files:

          - \`config.toml\`
          - \`.github/workflows/upstream-sync.yml\`

          Validation performed:

          - Upstream URL verified
          - Upstream commit pinned
          - Protected files preserved
          - Bash syntax checked
          - sync-hagezi.sh executable permission checked
          - Upstream script was NOT executed
          - Upstream tests were NOT executed
          - Upstream builds were NOT executed
          - Upstream dependencies were NOT installed

          Manual review required before merging.
          EOF
          )"

          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          else
            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"
          fi

      - name: Complete
        if: steps.changes.outputs.changed == 'false'
        shell: bash
        run: |
          echo "Upstream and fork are already synchronized."
