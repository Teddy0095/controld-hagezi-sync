name: Sync Fork with Upstream

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-fork-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/0x11DFE/controld-hagezi-sync.git
  UPSTREAM_BRANCH: main
  BASE_BRANCH: main
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    name: Check upstream and create PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch repositories
        shell: bash
        run: |
          set -euo pipefail

          git fetch --prune origin \
            "refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

          git fetch --prune --no-tags \
            "$UPSTREAM_REPO" \
            "refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          BASE_COMMIT="$(git rev-parse "origin/${BASE_BRANCH}")"
          UPSTREAM_COMMIT="$(
            git rev-parse "refs/remotes/upstream/${UPSTREAM_BRANCH}"
          )"

          echo "$BASE_COMMIT" > /tmp/base-commit
          echo "$UPSTREAM_COMMIT" > /tmp/upstream-commit

          echo "Base:"
          echo "$BASE_COMMIT"

          echo "Upstream:"
          echo "$UPSTREAM_COMMIT"

      - name: Verify protected files
        shell: bash
        run: |
          set -euo pipefail

          protected_files=(
            "config.toml"
            ".github/workflows/upstream-sync.yml"
            ".github/workflows/sync.yml"
          )

          mkdir -p /tmp/protected/.github/workflows

          for file in "${protected_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Protected file missing: $file"
              exit 1
            fi
          done

          cp config.toml \
            /tmp/protected/config.toml

          cp .github/workflows/upstream-sync.yml \
            /tmp/protected/.github/workflows/upstream-sync.yml

          cp .github/workflows/sync.yml \
            /tmp/protected/.github/workflows/sync.yml

          echo "Protected files saved."

      # ------------------------------------------------------------
      # Create the sync branch BEFORE modifying anything.
      # ------------------------------------------------------------

      - name: Create synchronization branch
        shell: bash
        run: |
          set -euo pipefail

          BASE_COMMIT="$(cat /tmp/base-commit)"

          git checkout -B "$SYNC_BRANCH" "$BASE_COMMIT"

          echo "Synchronization branch created from:"
          echo "$BASE_COMMIT"

      # ------------------------------------------------------------
      # Replace the working tree with upstream.
      #
      # We use read-tree here because it correctly handles:
      #   - added files
      #   - modified files
      #   - deleted files
      #   - renamed files
      #
      # Then protected files are restored.
      # ------------------------------------------------------------

      - name: Import upstream tree
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat /tmp/upstream-commit)"

          echo "Importing upstream tree:"
          echo "$UPSTREAM_COMMIT"

          git read-tree --reset -u "$UPSTREAM_COMMIT"

          cp \
            /tmp/protected/config.toml \
            config.toml

          cp \
            /tmp/protected/.github/workflows/upstream-sync.yml \
            .github/workflows/upstream-sync.yml

          cp \
            /tmp/protected/.github/workflows/sync.yml \
            .github/workflows/sync.yml

          echo "Upstream tree imported."

      - name: Verify protected files
        shell: bash
        run: |
          set -euo pipefail

          if ! cmp -s \
            config.toml \
            /tmp/protected/config.toml; then

            echo "::error::config.toml changed."
            exit 1
          fi

          if ! cmp -s \
            .github/workflows/upstream-sync.yml \
            /tmp/protected/.github/workflows/upstream-sync.yml; then

            echo "::error::upstream-sync.yml changed."
            exit 1
          fi

          if ! cmp -s \
            .github/workflows/sync.yml \
            /tmp/protected/.github/workflows/sync.yml; then

            echo "::error::sync.yml changed."
            exit 1
          fi

          echo "Protected files preserved."

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "sync-hagezi.sh"
            "config.toml"
            ".github/workflows/sync.yml"
            ".github/workflows/upstream-sync.yml"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
          done

          echo "Required files OK."

      - name: Validate Bash
        shell: bash
        run: |
          set -euo pipefail

          bash -n sync-hagezi.sh

          if [[ ! -x sync-hagezi.sh ]]; then
            echo "::error::sync-hagezi.sh is not executable."
            exit 1
          fi

          echo "Bash validation OK."

      - name: Validate workflows
        shell: bash
        run: |
          set -euo pipefail

          for workflow in \
            .github/workflows/sync.yml \
            .github/workflows/upstream-sync.yml; do

            echo "Checking: $workflow"

            grep -q '^name:' "$workflow" || {
              echo "::error::$workflow has no name."
              exit 1
            }

            grep -q '^on:' "$workflow" || {
              echo "::error::$workflow has no on declaration."
              exit 1
            }

          done

          grep -q 'sync-hagezi.sh' \
            .github/workflows/sync.yml || {
            echo "::error::sync.yml does not reference sync-hagezi.sh."
            exit 1
          }

          echo "Workflow validation OK."

      - name: Check for hard-coded Control D token
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            --exclude-dir=.git \
            --exclude='upstream-sync.yml' \
            'CONTROLD_API_TOKEN[[:space:]]*=' \
            .; then

            echo "::error::Possible hard-coded Control D token detected."
            exit 1
          fi

          echo "No obvious hard-coded Control D token detected."

      - name: Check Git diff
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          git diff --cached --check

          echo "Git diff validation OK."

      - name: Check for protected file changes
        id: protected
        shell: bash
        run: |
          set -euo pipefail

          protected_files=(
            "config.toml"
            ".github/workflows/upstream-sync.yml"
            ".github/workflows/sync.yml"
          )

          for file in "${protected_files[@]}"; do
            if ! git diff --cached --quiet -- "$file"; then
              echo "::error::Protected file changed: $file"
              exit 1
            fi
          done

          echo "Protected files are unchanged."

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already synchronized."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo
          echo "Changed files:"
          git diff --cached --name-status

          echo
          echo "Statistics:"
          git diff --cached --stat

      - name: Check change size
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          FILE_COUNT="$(
            git diff --cached --name-only | wc -l
          )"

          INSERTIONS="$(
            git diff --cached --numstat |
            awk '$1 ~ /^[0-9]+$/ { sum += $1 }
                 END { print sum + 0 }'
          )"

          DELETIONS="$(
            git diff --cached --numstat |
            awk '$2 ~ /^[0-9]+$/ { sum += $2 }
                 END { print sum + 0 }'
          )"

          TOTAL=$((INSERTIONS + DELETIONS))

          echo "Changed files: $FILE_COUNT"
          echo "Changed lines: $TOTAL"

          if (( FILE_COUNT > 250 )); then
            echo "::error::More than 250 files changed."
            exit 1
          fi

          if (( TOTAL > 20000 )); then
            echo "::error::More than 20,000 lines changed."
            exit 1
          fi

      - name: Detect workflow changes
        if: steps.changes.outputs.changed == 'true'
        id: workflow_changes
        shell: bash
        run: |
          set -euo pipefail

          if git diff --cached --name-only |
            grep -E '^\.github/workflows/.*\.(yml|yaml)$' |
            grep -q .; then

            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Workflow files changed."

          else

            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No workflow files changed."

          fi

      - name: Commit synchronization
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat /tmp/upstream-commit)"

          git commit \
            -m "chore: sync with upstream" \
            -m "Upstream commit: ${UPSTREAM_COMMIT}"

      - name: Push synchronization branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git push \
            --force-with-lease \
            origin \
            "$SYNC_BRANCH"

      - name: Create or update Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat /tmp/upstream-commit)"

          if [[ \
            "${{ steps.workflow_changes.outputs.changed }}" \
            == "true"
          ]]; then

            WORKFLOW_WARNING="⚠️ Workflow files changed. Review carefully."

          else

            WORKFLOW_WARNING="No workflow files changed."

          fi

          PR_TITLE="chore: sync with upstream"

          PR_BODY="$(cat <<EOF
## Upstream synchronization

Source:

**0x11DFE/controld-hagezi-sync**

Upstream commit:

\`${UPSTREAM_COMMIT}\`

## Validation

- [x] Upstream commit pinned
- [x] Required files checked
- [x] Bash syntax checked
- [x] Executable permission checked
- [x] Workflow sanity checked
- [x] Git whitespace checked
- [x] Protected files preserved
- [x] Protected files verified unchanged
- [x] Change-size limits checked
- [x] Upstream script was NOT executed
- [x] main was NOT modified automatically

## Protected files

- \`config.toml\`
- \`.github/workflows/upstream-sync.yml\`
- \`.github/workflows/sync.yml\`

## Workflow changes

${WORKFLOW_WARNING}

## Review

Please review the complete diff before merging.

Pay particular attention to:

- GitHub Actions changes
- shell commands
- network destinations
- secret handling
- executable files
- sync-hagezi.sh

EOF
)"

          EXISTING_PR="$(
            gh pr list \
              --head "$SYNC_BRANCH" \
              --base "$BASE_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [[ -n "$EXISTING_PR" ]]; then

            echo "Updating PR #$EXISTING_PR"

            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          else

            echo "Creating Pull Request"

            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          fi

          echo "Pull Request ready."
