name: 🔄 Upstream Sync

on:
  schedule:
    # Every 6 hours at 30 minutes past the hour (UTC)
    # 00:30, 06:30, 12:30, 18:30
    - cron: "30 */6 * * *"
  workflow_dispatch:

# ============================================================================
# SECURITY MODEL
# ============================================================================
#
# UPSTREAM IS UNTRUSTED DATA.
#
# This workflow:
#   1. checks the exact trusted upstream URL
#   2. fetches the trusted fork
#   3. fetches the pinned upstream branch
#   4. pins the exact upstream commit + tree
#   5. preserves fork-owned files
#   6. imports the exact upstream Git tree
#   7. restores fork-owned files
#   8. verifies all non-protected paths against upstream
#   9. performs static validation only
#  10. creates/updates a review PR
#
# This workflow NEVER:
#   - executes sync-hagezi.sh
#   - sources upstream shell code
#   - runs upstream tests
#   - runs upstream builds
#   - installs upstream dependencies
#   - executes upstream GitHub Actions
#   - executes upstream package managers
#   - auto-merges the synchronization PR
#
# Fork-owned files:
#   config.toml
#   .github/workflows/upstream-sync.yml
#
# ============================================================================

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  # ==========================================================================
  # TRUSTED UPSTREAM
  # ==========================================================================

  UPSTREAM_URL: https://github.com/0x11DFE/controld-hagezi-sync.git
  UPSTREAM_BRANCH: main

  # ==========================================================================
  # FORK
  # ==========================================================================

  TARGET_BRANCH: main
  SYNC_BRANCH: automation/upstream-sync

  # ==========================================================================
  # FORK-OWNED FILES
  # ==========================================================================

  PROTECTED_CONFIG: config.toml
  PROTECTED_WORKFLOW: .github/workflows/upstream-sync.yml

jobs:
  sync:
    name: 🔄 Synchronize upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    defaults:
      run:
        shell: bash

    steps:

      # ======================================================================
      # 1. CHECKOUT FORK
      # ======================================================================

      - name: 📥 Checkout trusted fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
          submodules: false
          lfs: false

      # ======================================================================
      # 2. CONFIGURE GIT
      # ======================================================================

      - name: ⚙️ Configure Git
        run: |
          set -euo pipefail

          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config --local core.pager cat
          git config --local pager.diff false
          git config --local pager.log false
          git config --local advice.detachedHead false
          git config --local credential.helper ""

          echo "✅ Git configured."

      # ======================================================================
      # 3. VERIFY TRUSTED UPSTREAM
      # ======================================================================

      - name: 🔐 Verify trusted upstream
        run: |
          set -euo pipefail

          EXPECTED_UPSTREAM_URL="https://github.com/0x11DFE/controld-hagezi-sync.git"
          NORMALIZED_URL="${UPSTREAM_URL%/}"

          echo "=========================================="
          echo "VERIFYING TRUSTED UPSTREAM"
          echo "=========================================="
          echo "Configured URL: [$UPSTREAM_URL]"
          echo "Normalized URL: [$NORMALIZED_URL]"
          echo "Expected URL:   [$EXPECTED_UPSTREAM_URL]"
          echo "Branch:         [$UPSTREAM_BRANCH]"
          echo "=========================================="

          if [[ "$NORMALIZED_URL" != "$EXPECTED_UPSTREAM_URL" ]]; then
            echo "::error::Configured upstream URL does not match trusted repository"
            echo "::error::Expected: $EXPECTED_UPSTREAM_URL"
            echo "::error::Configured: $UPSTREAM_URL"
            exit 1
          fi

          if [[ "$UPSTREAM_BRANCH" != "main" ]]; then
            echo "::error::Unexpected upstream branch"
            exit 1
          fi

          if [[ "$NORMALIZED_URL" != https://github.com/*.git ]]; then
            echo "::error::Upstream URL must be an HTTPS GitHub repository URL"
            exit 1
          fi

          echo "✅ Trusted upstream verified."

      # ======================================================================
      # 4. FETCH AND PIN EXACT COMMITS
      # ======================================================================

      - name: 🌐 Fetch and pin revisions
        run: |
          set -euo pipefail

          FORK_REF="refs/remotes/origin/${TARGET_BRANCH}"
          UPSTREAM_REF="refs/remotes/upstream/${UPSTREAM_BRANCH}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Fetching fork"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          git fetch \
            --no-tags \
            --prune \
            origin \
            "refs/heads/${TARGET_BRANCH}:${FORK_REF}"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Fetching upstream"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          git fetch \
            --no-tags \
            --prune \
            "$UPSTREAM_URL" \
            "refs/heads/${UPSTREAM_BRANCH}:${UPSTREAM_REF}"

          FORK_COMMIT="$(git rev-parse "$FORK_REF")"
          UPSTREAM_COMMIT="$(git rev-parse "$UPSTREAM_REF")"

          [[ "$FORK_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid fork commit SHA"
            exit 1
          }

          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid upstream commit SHA"
            exit 1
          }

          [[ "$(git cat-file -t "$FORK_COMMIT")" == "commit" ]] || {
            echo "::error::Fork object is not a commit"
            exit 1
          }

          [[ "$(git cat-file -t "$UPSTREAM_COMMIT")" == "commit" ]] || {
            echo "::error::Upstream object is not a commit"
            exit 1
          }

          UPSTREAM_TREE="$(git rev-parse "${UPSTREAM_COMMIT}^{tree}")"

          [[ "$UPSTREAM_TREE" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid upstream tree SHA"
            exit 1
          }

          [[ "$(git cat-file -t "$UPSTREAM_TREE")" == "tree" ]] || {
            echo "::error::Upstream tree is not a tree object"
            exit 1
          }

          printf '%s\n' "$FORK_COMMIT" \
            > "$RUNNER_TEMP/fork-commit"

          printf '%s\n' "$UPSTREAM_COMMIT" \
            > "$RUNNER_TEMP/upstream-commit"

          printf '%s\n' "$UPSTREAM_TREE" \
            > "$RUNNER_TEMP/upstream-tree"

          echo
          echo "Fork commit:     $FORK_COMMIT"
          echo "Upstream commit: $UPSTREAM_COMMIT"
          echo "Upstream tree:   $UPSTREAM_TREE"
          echo
          echo "✅ Exact revisions pinned."

      # ======================================================================
      # 5. RESET TO FORK
      # ======================================================================

      - name: 🧹 Reset workspace
        run: |
          set -euo pipefail

          FORK_COMMIT="$(cat "$RUNNER_TEMP/fork-commit")"

          git reset --hard "$FORK_COMMIT"
          git clean -ffdx

          [[ "$(git rev-parse HEAD)" == "$FORK_COMMIT" ]] || {
            echo "::error::Workspace does not match fork commit"
            exit 1
          }

          echo "✅ Workspace matches trusted fork."

      # ======================================================================
      # 6. SAVE FORK-OWNED FILES
      # ======================================================================

      - name: 🛡️ Save protected fork files
        run: |
          set -euo pipefail

          PROTECTED_DIR="$RUNNER_TEMP/upstream-sync-protected"

          rm -rf -- "$PROTECTED_DIR"
          mkdir -p -- "$PROTECTED_DIR"

          # ------------------------------------------------------------------
          # Validate directories.
          # ------------------------------------------------------------------

          for dir in \
            ".github" \
            ".github/workflows"; do

            [[ -d "$dir" ]] || {
              echo "::error::Protected directory missing: $dir"
              exit 1
            }

            [[ ! -L "$dir" ]] || {
              echo "::error::Protected directory is a symlink: $dir"
              exit 1
            }

          done

          # ------------------------------------------------------------------
          # Validate files.
          # ------------------------------------------------------------------

          for file in \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_WORKFLOW"; do

            [[ -f "$file" ]] || {
              echo "::error::Protected file missing: $file"
              exit 1
            }

            [[ ! -L "$file" ]] || {
              echo "::error::Protected file is a symlink: $file"
              exit 1
            }

          done

          # ------------------------------------------------------------------
          # Validate Git modes.
          # ------------------------------------------------------------------

          for file in \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_WORKFLOW"; do

            MODE="$(
              git ls-files --stage -- "$file" |
                awk '{print $1}'
            )"

            [[ "$MODE" == "100644" ]] || {
              echo "::error::Unexpected Git mode for $file: $MODE"
              exit 1
            }

          done

          # ------------------------------------------------------------------
          # Copy outside workspace.
          # ------------------------------------------------------------------

          install -m 600 \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_DIR/config.toml"

          install -m 600 \
            "$PROTECTED_WORKFLOW" \
            "$PROTECTED_DIR/upstream-sync.yml"

          echo "✅ Protected files saved."

      # ======================================================================
      # 7. INSPECT UPSTREAM PROTECTED PATHS
      # ======================================================================

      - name: 🔎 Inspect upstream protected paths
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          for file in \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_WORKFLOW"; do

            ENTRY="$(
              git ls-tree \
                -r \
                --full-tree \
                "$UPSTREAM_COMMIT" \
                -- "$file"
            )"

            if [[ -z "$ENTRY" ]]; then
              echo "ℹ️ Upstream does not contain: $file"
              continue
            fi

            echo "Upstream entry:"
            echo "$ENTRY"

            MODE="$(awk '{print $1}' <<< "$ENTRY")"
            TYPE="$(awk '{print $2}' <<< "$ENTRY")"

            [[ "$TYPE" == "blob" ]] || {
              echo "::error::Upstream protected path is not a blob: $file"
              exit 1
            }

            [[ "$MODE" == "100644" || "$MODE" == "100755" ]] || {
              echo "::error::Unexpected upstream mode for $file: $MODE"
              exit 1
            }

          done

          echo "✅ Upstream protected paths inspected."

      # ======================================================================
      # 8. IMPORT EXACT UPSTREAM TREE
      # ======================================================================

      - name: 📦 Import exact upstream tree
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"
          PROTECTED_DIR="$RUNNER_TEMP/upstream-sync-protected"

          echo "Importing upstream commit:"
          echo "$UPSTREAM_COMMIT"

          # This changes Git state.
          # It does NOT execute imported files.

          git read-tree \
            --reset \
            -u \
            "$UPSTREAM_COMMIT"

          # ------------------------------------------------------------------
          # Reject structural replacement of protected paths.
          # ------------------------------------------------------------------

          if [[ -d "$PROTECTED_CONFIG" && ! -L "$PROTECTED_CONFIG" ]]; then
            echo "::error::Upstream replaced config.toml with a directory"
            exit 1
          fi

          if [[ -d "$PROTECTED_WORKFLOW" && ! -L "$PROTECTED_WORKFLOW" ]]; then
            echo "::error::Upstream replaced protected workflow with a directory"
            exit 1
          fi

          # ------------------------------------------------------------------
          # Remove upstream versions.
          # ------------------------------------------------------------------

          rm -f -- "$PROTECTED_CONFIG"
          rm -f -- "$PROTECTED_WORKFLOW"

          # ------------------------------------------------------------------
          # Verify GitHub Actions structure.
          # ------------------------------------------------------------------

          if [[ -e ".github" && ! -d ".github" ]]; then
            echo "::error::.github is not a directory"
            exit 1
          fi

          [[ ! -L ".github" ]] || {
            echo "::error::.github is a symlink"
            exit 1
          }

          if [[ -e ".github/workflows" &&
                ! -d ".github/workflows" ]]; then
            echo "::error::.github/workflows is not a directory"
            exit 1
          fi

          [[ ! -L ".github/workflows" ]] || {
            echo "::error::.github/workflows is a symlink"
            exit 1
          }

          mkdir -p -- ".github/workflows"

          # ------------------------------------------------------------------
          # Restore fork-owned files.
          # ------------------------------------------------------------------

          install -m 600 \
            "$PROTECTED_DIR/config.toml" \
            "$PROTECTED_CONFIG"

          install -m 600 \
            "$PROTECTED_DIR/upstream-sync.yml" \
            "$PROTECTED_WORKFLOW

          echo "✅ Upstream tree imported."
          echo "✅ Protected files restored."

      # ======================================================================
      # 9. VERIFY PROTECTED FILES
      # ======================================================================

      - name: 🔐 Verify protected files
        run: |
          set -euo pipefail

          PROTECTED_DIR="$RUNNER_TEMP/upstream-sync-protected"

          for file in \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_WORKFLOW"; do

            [[ -f "$file" && ! -L "$file" ]] || {
              echo "::error::Protected file invalid: $file"
              exit 1
            }

          done

          cmp -s \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_DIR/config.toml" || {
              echo "::error::config.toml was modified"
              exit 1
            }

          cmp -s \
            "$PROTECTED_WORKFLOW" \
            "$PROTECTED_DIR/upstream-sync.yml" || {
              echo "::error::upstream-sync.yml was modified"
              exit 1
            }

          echo "✅ Protected files verified byte-for-byte."

      # ======================================================================
      # 10. VERIFY ONLY OUR WORKFLOW EXISTS
      # ======================================================================

      - name: 🧱 Verify GitHub Actions boundary
        run: |
          set -euo pipefail

          WORKFLOW_DIR=".github/workflows"
          EXPECTED="upstream-sync.yml"

          [[ -d ".github" && ! -L ".github" ]] || {
            echo "::error::.github is invalid"
            exit 1
          }

          [[ -d "$WORKFLOW_DIR" && ! -L "$WORKFLOW_DIR" ]] || {
            echo "::error::.github/workflows is invalid"
            exit 1
          }

          mapfile -t ENTRIES < <(
            find "$WORKFLOW_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -printf '%P\n' |
              sort
          )

          if [[ "${#ENTRIES[@]}" -ne 1 ||
                "${ENTRIES[0]}" != "$EXPECTED" ]]; then

            echo "::error::Unexpected content in .github/workflows"

            echo "Expected:"
            echo "  $EXPECTED"

            echo "Found:"

            if [[ "${#ENTRIES[@]}" -eq 0 ]]; then
              echo "  <none>"
            else
              printf '  %s\n' "${ENTRIES[@]}"
            fi

            exit 1
          fi

          [[ -f "$WORKFLOW_DIR/$EXPECTED" ]] || {
            echo "::error::Protected workflow missing"
            exit 1
          }

          [[ ! -L "$WORKFLOW_DIR/$EXPECTED" ]] || {
            echo "::error::Protected workflow is a symlink"
            exit 1
          }

          echo "✅ GitHub Actions boundary verified."
          echo "✅ No upstream workflows survived."

      # ======================================================================
      # 11. VERIFY NON-PROTECTED TREE
      # ======================================================================

      - name: 🧬 Verify final tree against upstream
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          UPSTREAM_LIST="$RUNNER_TEMP/upstream-tree-list"
          FINAL_LIST="$RUNNER_TEMP/final-tree-list"

          # ------------------------------------------------------------------
          # Upstream tree, excluding fork-owned files.
          # ------------------------------------------------------------------

          git ls-tree \
            -r \
            --full-tree \
            "$UPSTREAM_COMMIT" |
            awk '
              {
                path = $4

                if (
                  path != "config.toml" &&
                  path != ".github/workflows/upstream-sync.yml"
                ) {
                  print
                }
              }
            ' |
            sort \
            > "$UPSTREAM_LIST"

          # ------------------------------------------------------------------
          # Final Git index, excluding fork-owned files.
          # ------------------------------------------------------------------

          git ls-files \
            --stage |
            awk '
              {
                mode = $1
                object = $2
                path = $4

                if (
                  path != "config.toml" &&
                  path != ".github/workflows/upstream-sync.yml"
                ) {
                  type = (mode == "160000" ? "commit" : "blob")

                  print mode " " type " " object "\t" path
                }
              }
            ' |
            sort \
            > "$FINAL_LIST"

          if ! cmp -s "$UPSTREAM_LIST" "$FINAL_LIST"; then
            echo "::error::Final non-protected tree does not match upstream"

            echo
            echo "Differences:"
            diff -u "$UPSTREAM_LIST" "$FINAL_LIST" || true

            exit 1
          fi

          echo "✅ Every non-protected Git path matches upstream."

      # ======================================================================
      # 12. STATIC VALIDATION ONLY
      # ======================================================================

      - name: 🧪 Validate upstream code
        run: |
          set -euo pipefail

          FILE="sync-hagezi.sh"

          [[ -f "$FILE" ]] || {
            echo "::error::Required upstream file missing: $FILE"
            exit 1
          }

          [[ ! -L "$FILE" ]] || {
            echo "::error::sync-hagezi.sh is a symlink"
            exit 1
          }

          git ls-files \
            --error-unmatch \
            "$FILE" \
            >/dev/null 2>&1 || {
              echo "::error::sync-hagezi.sh is not tracked"
              exit 1
            }

          MODE="$(
            git ls-files --stage -- "$FILE" |
              awk '{print $1}'
          )"

          [[ "$MODE" == "100755" ]] || {
            echo "::error::sync-hagezi.sh must be 100755, got $MODE"
            exit 1
          }

          echo "Running Bash syntax check..."

          # bash -n ONLY parses.
          # It does not execute the script.

          bash -n "$FILE"

          echo "✅ Bash syntax check passed."
          echo "ℹ️ Upstream code was NOT executed."

      # ======================================================================
      # 13. FINAL GIT VALIDATION
      # ======================================================================

      - name: 🔎 Final Git validation
        run: |
          set -euo pipefail

          FORK_COMMIT="$(cat "$RUNNER_TEMP/fork-commit")"
          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"
          EXPECTED_TREE="$(cat "$RUNNER_TEMP/upstream-tree")"

          if git ls-files --unmerged | grep -q .; then
            echo "::error::Unmerged Git index entries detected"
            exit 1
          fi

          git ls-files \
            --error-unmatch \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_WORKFLOW" \
            >/dev/null

          ACTUAL_TREE="$(git rev-parse "${UPSTREAM_COMMIT}^{tree}")"

          [[ "$ACTUAL_TREE" == "$EXPECTED_TREE" ]] || {
            echo "::error::Pinned upstream tree changed"
            exit 1
          }

          git diff \
            --check \
            "$FORK_COMMIT" \
            -- .

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "FINAL VERIFICATION"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo
          echo "Fork commit:"
          echo "  $FORK_COMMIT"
          echo
          echo "Upstream commit:"
          echo "  $UPSTREAM_COMMIT"
          echo
          echo "Upstream tree:"
          echo "  $EXPECTED_TREE"
          echo
          echo "Protected files:"
          git ls-files \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_WORKFLOW"

          echo
          echo "✅ Final Git validation passed."

      # ======================================================================
      # 14. CHECK FOR CHANGES
      # ======================================================================

      - name: 🔎 Check for changes
        id: changes
        run: |
          set -euo pipefail

          git add --all

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✨ Already synchronized"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Synchronization changes detected"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo
          echo "Statistics:"
          git diff --cached --stat

          echo
          echo "Files:"
          git diff --cached --name-status

      # ======================================================================
      # 15. COMMIT
      # ======================================================================

      - name: 📝 Commit synchronization
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          git commit \
            -m "Sync with upstream" \
            -m "Upstream commit: ${UPSTREAM_COMMIT}"

          echo "✅ Synchronization commit created."

      # ======================================================================
      # 16. PUSH SYNC BRANCH
      # ======================================================================

      - name: 🚀 Push synchronization branch
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TEMP_GIT_CONFIG="$RUNNER_TEMP/git-push-config"

          cleanup() {
            rm -f -- "$TEMP_GIT_CONFIG"
          }

          trap cleanup EXIT HUP INT TERM

          git config \
            --file "$TEMP_GIT_CONFIG" \
            "http.https://github.com/.extraheader" \
            "AUTHORIZATION: bearer ${GH_TOKEN}"

          chmod 600 "$TEMP_GIT_CONFIG"

          GIT_CONFIG_GLOBAL=/dev/null \
          GIT_CONFIG_SYSTEM=/dev/null \
          GIT_CONFIG_NOSYSTEM=1 \
          git \
            -c "include.path=$TEMP_GIT_CONFIG" \
            push \
            --force-with-lease \
            origin \
            "HEAD:${SYNC_BRANCH}"

          echo "✅ Synchronization branch pushed."

      # ======================================================================
      # 17. CREATE / UPDATE PR
      # ======================================================================

      - name: 🔀 Create or update review PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FORK_COMMIT="$(cat "$RUNNER_TEMP/fork-commit")"
          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"
          UPSTREAM_TREE="$(cat "$RUNNER_TEMP/upstream-tree")"

          EXISTING_PR="$(
            gh pr list \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"

          PR_TITLE="🔄 Sync with upstream"

          PR_BODY="$(
            cat <<EOF
          ## 🔄 Upstream synchronization

          This pull request was generated automatically.

          Upstream is treated as untrusted data.

          ### Pinned revisions

          | Source | Revision |
          |---|---|
          | Fork | \`$FORK_COMMIT\` |
          | Upstream | \`$UPSTREAM_COMMIT\` |
          | Upstream tree | \`$UPSTREAM_TREE\` |

          ### Trusted upstream

          \`$UPSTREAM_URL\`

          ### Fork-owned files

          These files remain controlled by this fork:

          - \`config.toml\`
          - \`.github/workflows/upstream-sync.yml\`

          ### Security checks

          - Trusted upstream URL verified
