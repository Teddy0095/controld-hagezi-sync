name: 🔄 Upstream Sync

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/0x11DFE/controld-hagezi-sync.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main
  SYNC_BRANCH: automation/upstream-sync

  PROTECTED_CONFIG: config.toml
  PROTECTED_WORKFLOW: .github/workflows/upstream-sync.yml

jobs:
  sync:
    name: 🔄 Synchronize upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:

      # ================================================================
      # 1. CHECKOUT
      # ================================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
          submodules: false
          lfs: false

      # ================================================================
      # 2. CONFIGURE GIT
      # ================================================================

      - name: ⚙️ Configure Git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config core.pager cat
          git config pager.diff false
          git config pager.log false

          echo "Git configured."

      # ================================================================
      # 3. VERIFY TRUSTED UPSTREAM
      # ================================================================

      - name: 🔐 Verify upstream identity
        run: |
          set -euo pipefail

          EXPECTED_URL="https://github.com/0x11DFE/controld-hagezi-sync.git"

          echo "Configured upstream:"
          echo "$UPSTREAM_URL"

          echo "Expected upstream:"
          echo "$EXPECTED_URL"

          if [[ "$UPSTREAM_URL" != "$EXPECTED_URL" ]]; then
            echo "::error::Configured upstream URL does not match trusted identity"
            exit 1
          fi

          if [[ "$UPSTREAM_BRANCH" != "main" ]]; then
            echo "::error::Unexpected upstream branch"
            exit 1
          fi

          echo "✅ Trusted upstream verified."

      # ================================================================
      # 4. FETCH FORK AND UPSTREAM
      # ================================================================

      - name: 🌐 Fetch repositories
        run: |
          set -euo pipefail

          git fetch \
            --no-tags \
            --prune \
            origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          git fetch \
            --no-tags \
            --prune \
            "$UPSTREAM_URL" \
            "refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          FORK_COMMIT="$(
            git rev-parse "refs/remotes/origin/${TARGET_BRANCH}"
          )"

          UPSTREAM_COMMIT="$(
            git rev-parse "refs/remotes/upstream/${UPSTREAM_BRANCH}"
          )"

          [[ "$FORK_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid fork commit"
            exit 1
          }

          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid upstream commit"
            exit 1
          }

          UPSTREAM_TREE="$(
            git rev-parse "${UPSTREAM_COMMIT}^{tree}"
          )"

          printf '%s\n' "$FORK_COMMIT" \
            > "$RUNNER_TEMP/fork-commit"

          printf '%s\n' "$UPSTREAM_COMMIT" \
            > "$RUNNER_TEMP/upstream-commit"

          printf '%s\n' "$UPSTREAM_TREE" \
            > "$RUNNER_TEMP/upstream-tree"

          echo "Fork commit:     $FORK_COMMIT"
          echo "Upstream commit: $UPSTREAM_COMMIT"
          echo "Upstream tree:   $UPSTREAM_TREE"

      # ================================================================
      # 5. RESET TO FORK
      # ================================================================

      - name: 🧹 Reset to trusted fork
        run: |
          set -euo pipefail

          FORK_COMMIT="$(cat "$RUNNER_TEMP/fork-commit")"

          git reset --hard "$FORK_COMMIT"
          git clean -ffdx

          [[ "$(git rev-parse HEAD)" == "$FORK_COMMIT" ]] || {
            echo "::error::Workspace does not match fork"
            exit 1
          }

          echo "✅ Workspace reset to fork."

      # ================================================================
      # 6. SAVE PROTECTED FILES
      # ================================================================

      - name: 🛡️ Save fork-owned files
        run: |
          set -euo pipefail

          SAVE_DIR="$RUNNER_TEMP/protected"

          rm -rf "$SAVE_DIR"
          mkdir -p "$SAVE_DIR"

          if [[ ! -f "$PROTECTED_CONFIG" ]]; then
            echo "::error::config.toml is missing"
            exit 1
          fi

          if [[ ! -f "$PROTECTED_WORKFLOW" ]]; then
            echo "::error::upstream-sync.yml is missing"
            exit 1
          fi

          if [[ -L "$PROTECTED_CONFIG" ]]; then
            echo "::error::config.toml is a symlink"
            exit 1
          fi

          if [[ -L "$PROTECTED_WORKFLOW" ]]; then
            echo "::error::upstream-sync.yml is a symlink"
            exit 1
          fi

          cp -- "$PROTECTED_CONFIG" \
            "$SAVE_DIR/config.toml"

          cp -- "$PROTECTED_WORKFLOW" \
            "$SAVE_DIR/upstream-sync.yml"

          echo "✅ Protected files saved."

      # ================================================================
      # 7. IMPORT UPSTREAM TREE
      # ================================================================

      - name: 📦 Import upstream tree
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"
          SAVE_DIR="$RUNNER_TEMP/protected"

          echo "Importing upstream commit:"
          echo "$UPSTREAM_COMMIT"

          git read-tree \
            --reset \
            -u \
            "$UPSTREAM_COMMIT"

          # Restore fork-owned config.
          cp -- \
            "$SAVE_DIR/config.toml" \
            "$PROTECTED_CONFIG"

          # Restore fork-owned workflow.
          mkdir -p ".github/workflows"

          cp -- \
            "$SAVE_DIR/upstream-sync.yml" \
            "$PROTECTED_WORKFLOW"

          echo "✅ Upstream tree imported."
          echo "✅ Protected files restored."

      # ================================================================
      # 8. REMOVE ANY EXTRA UPSTREAM WORKFLOWS
      # ================================================================

      - name: 🧱 Protect GitHub Actions directory
        run: |
          set -euo pipefail

          WORKFLOW_DIR=".github/workflows"

          if [[ ! -d ".github" ]]; then
            mkdir -p ".github"
          fi

          if [[ -L ".github" ]]; then
            echo "::error::.github is a symlink"
            exit 1
          fi

          if [[ -e "$WORKFLOW_DIR" && ! -d "$WORKFLOW_DIR" ]]; then
            echo "::error::.github/workflows is not a directory"
            exit 1
          fi

          if [[ -L "$WORKFLOW_DIR" ]]; then
            echo "::error::.github/workflows is a symlink"
            exit 1
          fi

          mkdir -p "$WORKFLOW_DIR"

          find "$WORKFLOW_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name "upstream-sync.yml" \
            -exec rm -rf -- {} +

          echo "Remaining workflow:"
          find "$WORKFLOW_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' |
            sort

          echo "✅ Only upstream-sync.yml remains."

      # ================================================================
      # 9. VERIFY PROTECTED FILES
      # ================================================================

      - name: 🔐 Verify protected files
        run: |
          set -euo pipefail

          SAVE_DIR="$RUNNER_TEMP/protected"

          [[ -f "$PROTECTED_CONFIG" ]] || {
            echo "::error::config.toml missing"
            exit 1
          }

          [[ -f "$PROTECTED_WORKFLOW" ]] || {
            echo "::error::upstream-sync.yml missing"
            exit 1
          }

          [[ ! -L "$PROTECTED_CONFIG" ]] || {
            echo "::error::config.toml is a symlink"
            exit 1
          }

          [[ ! -L "$PROTECTED_WORKFLOW" ]] || {
            echo "::error::upstream-sync.yml is a symlink"
            exit 1
          }

          cmp -s \
            "$PROTECTED_CONFIG" \
            "$SAVE_DIR/config.toml" || {
              echo "::error::config.toml changed"
              exit 1
            }

          cmp -s \
            "$PROTECTED_WORKFLOW" \
            "$SAVE_DIR/upstream-sync.yml" || {
              echo "::error::upstream-sync.yml changed"
              exit 1
            }

          echo "✅ Protected files are unchanged."

      # ================================================================
      # 10. VERIFY WORKFLOW DIRECTORY
      # ================================================================

      - name: 🔎 Verify workflow boundary
        run: |
          set -euo pipefail

          WORKFLOW_DIR=".github/workflows"

          [[ -d "$WORKFLOW_DIR" ]] || {
            echo "::error::Workflow directory missing"
            exit 1
          }

          COUNT=0

          while IFS= read -r -d '' ITEM; do
            NAME="$(basename "$ITEM")"

            if [[ "$NAME" != "upstream-sync.yml" ]]; then
              echo "::error::Unexpected workflow file detected: $NAME"
              exit 1
            fi

            COUNT=$((COUNT + 1))
          done < <(
            find "$WORKFLOW_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -print0
          )

          if [[ "$COUNT" -ne 1 ]]; then
            echo "::error::Expected exactly one workflow file"
            exit 1
          fi

          echo "✅ Workflow boundary verified."

      # ================================================================
      # 11. VERIFY UPSTREAM CONTENT
      # ================================================================

      - name: 🧬 Verify imported tree
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          UPSTREAM_LIST="$RUNNER_TEMP/upstream-list"
          FINAL_LIST="$RUNNER_TEMP/final-list"

          git ls-tree \
            -r \
            --full-tree \
            "$UPSTREAM_COMMIT" |
            while IFS= read -r LINE; do

              PATH_NAME="${LINE#*$'\t'}"

              if [[ "$PATH_NAME" == "config.toml" ]]; then
                continue
              fi

              if [[ "$PATH_NAME" == ".github/workflows/upstream-sync.yml" ]]; then
                continue
              fi

              printf '%s\n' "$LINE"

            done |
            sort > "$UPSTREAM_LIST"

          git ls-files \
            --stage |
            while IFS=$'\t' read -r META PATH_NAME; do

              if [[ "$PATH_NAME" == "config.toml" ]]; then
                continue
              fi

              if [[ "$PATH_NAME" == ".github/workflows/upstream-sync.yml" ]]; then
                continue
              fi

              printf '%s\t%s\n' "$META" "$PATH_NAME"

            done |
            sort > "$FINAL_LIST"

          if ! cmp -s "$UPSTREAM_LIST" "$FINAL_LIST"; then
            echo "::error::Imported tree does not match upstream"
            echo
            echo "Differences:"
            diff -u "$UPSTREAM_LIST" "$FINAL_LIST" || true
            exit 1
          fi

          echo "✅ Non-protected tree matches upstream."

      # ================================================================
      # 12. STATIC VALIDATION
      # ================================================================

      - name: 🧪 Validate sync script
        run: |
          set -euo pipefail

          FILE="sync-hagezi.sh"

          if [[ ! -f "$FILE" ]]; then
            echo "::error::sync-hagezi.sh missing"
            exit 1
          fi

          if [[ -L "$FILE" ]]; then
            echo "::error::sync-hagezi.sh is a symlink"
            exit 1
          fi

          MODE="$(
            git ls-files --stage -- "$FILE" |
            awk '{print $1}'
          )"

          if [[ "$MODE" != "100755" ]]; then
            echo "::error::sync-hagezi.sh is not executable"
            exit 1
          fi

          # Syntax check only.
          # The script is NOT executed.

          bash -n "$FILE"

          echo "✅ Bash syntax check passed."
          echo "ℹ️ sync-hagezi.sh was NOT executed."

      # ================================================================
      # 13. STAGE CHANGES
      # ================================================================

      - name: 🔎 Check for changes
        id: changes
        run: |
          set -euo pipefail

          # Add the final tree to the index.
          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✨ No synchronization changes."
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 Synchronization changes detected"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          git diff --cached --stat
          echo
          git diff --cached --name-status

      # ================================================================
      # 14. COMMIT
      # ================================================================

      - name: 📝 Commit synchronization
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          git commit \
            -m "Sync with upstream" \
            -m "Upstream commit: ${UPSTREAM_COMMIT}"

          echo "✅ Synchronization commit created."

      # ================================================================
      # 15. PUSH
      # ================================================================

      - name: 🚀 Push synchronization branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git push \
            --force-with-lease \
            origin \
            "HEAD:${SYNC_BRANCH}"

          echo "✅ Sync branch pushed."

      # ================================================================
      # 16. CREATE / UPDATE PR
      # ================================================================

      - name: 🔀 Create or update Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          EXISTING_PR="$(
            gh pr list \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"

          PR_TITLE="🔄 Sync with upstream"

          PR_BODY="$(
            cat <<EOF
          ## 🔄 Upstream synchronization

          Automatically generated synchronization PR.

          **Trusted upstream**

          \`$UPSTREAM_URL\`

          **Upstream commit**

          \`$UPSTREAM_COMMIT\`

          ### Protected fork files

          - \`config.toml\`
          - \`.github/workflows/upstream-sync.yml\`

          ### Security

          - Upstream identity verified
          - Upstream commit pinned
          - Protected files preserved
          - Protected files verified
          - Extra upstream workflows removed
          - Non-protected tree verified
          - Bash syntax checked
          - Upstream script was NOT executed
          - Upstream tests were NOT executed
          - Upstream builds were NOT executed
          - Upstream dependencies were NOT installed

          ### Review

          This PR requires manual review before merging.
          EOF
          )"

          if [[ -n "$EXISTING_PR" ]]; then

            echo "Updating PR #$EXISTING_PR"

            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          else

            echo "Creating Pull Request"

            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          fi

          echo "✅ Pull Request ready."

      # ================================================================
      # 17. COMPLETE
      # ================================================================

      - name: ✨ Complete
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✨ Upstream and fork are already synchronized."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
