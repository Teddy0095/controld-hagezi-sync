name: 🔄 Upstream Sync

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/0x11DFE/controld-hagezi-sync.git
  UPSTREAM_BRANCH: main
  TARGET_BRANCH: main
  SYNC_BRANCH: automation/upstream-sync

  PROTECTED_CONFIG: config.toml
  PROTECTED_WORKFLOW: .github/workflows/upstream-sync.yml

jobs:
  sync:
    name: 🔄 Synchronize upstream
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:

      # ================================================================
      # 1. CHECKOUT
      # ================================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          clean: true
          submodules: false
          lfs: false

      # ================================================================
      # 2. CONFIGURE GIT
      # ================================================================

      - name: ⚙️ Configure Git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git config core.pager cat
          git config pager.diff false
          git config pager.log false

          echo "✅ Git configured."

      # ================================================================
      # 3. VERIFY TRUSTED UPSTREAM
      # ================================================================

      - name: 🔐 Verify upstream identity
        run: |
          set -euo pipefail

          EXPECTED_URL="https://github.com/0x11DFE/controld-hagezi-sync.git"

          echo "=========================================="
          echo "Trusted upstream verification"
          echo "=========================================="
          echo "Configured:"
          echo "$UPSTREAM_URL"
          echo
          echo "Expected:"
          echo "$EXPECTED_URL"
          echo "=========================================="

          if [[ "$UPSTREAM_URL" != "$EXPECTED_URL" ]]; then
            echo "::error::Configured upstream URL does not match trusted identity"
            exit 1
          fi

          if [[ "$UPSTREAM_BRANCH" != "main" ]]; then
            echo "::error::Unexpected upstream branch"
            exit 1
          fi

          echo "✅ Trusted upstream verified."

      # ================================================================
      # 4. FETCH FORK AND UPSTREAM
      # ================================================================

      - name: 🌐 Fetch repositories
        run: |
          set -euo pipefail

          echo "Fetching fork..."

          git fetch \
            --no-tags \
            --prune \
            origin \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          echo "Fetching upstream..."

          git fetch \
            --no-tags \
            --prune \
            "$UPSTREAM_URL" \
            "refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

          FORK_COMMIT="$(
            git rev-parse "refs/remotes/origin/${TARGET_BRANCH}"
          )"

          UPSTREAM_COMMIT="$(
            git rev-parse "refs/remotes/upstream/${UPSTREAM_BRANCH}"
          )"

          [[ "$FORK_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid fork commit SHA"
            exit 1
          }

          [[ "$UPSTREAM_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid upstream commit SHA"
            exit 1
          }

          [[ "$(git cat-file -t "$FORK_COMMIT")" == "commit" ]] || {
            echo "::error::Fork reference is not a commit"
            exit 1
          }

          [[ "$(git cat-file -t "$UPSTREAM_COMMIT")" == "commit" ]] || {
            echo "::error::Upstream reference is not a commit"
            exit 1
          }

          UPSTREAM_TREE="$(
            git rev-parse "${UPSTREAM_COMMIT}^{tree}"
          )"

          [[ "$UPSTREAM_TREE" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid upstream tree SHA"
            exit 1
          }

          printf '%s\n' "$FORK_COMMIT" \
            > "$RUNNER_TEMP/fork-commit"

          printf '%s\n' "$UPSTREAM_COMMIT" \
            > "$RUNNER_TEMP/upstream-commit"

          printf '%s\n' "$UPSTREAM_TREE" \
            > "$RUNNER_TEMP/upstream-tree"

          echo
          echo "🏠 Fork commit:"
          echo "$FORK_COMMIT"
          echo
          echo "🌐 Upstream commit:"
          echo "$UPSTREAM_COMMIT"
          echo
          echo "🌳 Upstream tree:"
          echo "$UPSTREAM_TREE"

      # ================================================================
      # 5. RESET TO TRUSTED FORK
      # ================================================================

      - name: 🧹 Reset workspace
        run: |
          set -euo pipefail

          FORK_COMMIT="$(cat "$RUNNER_TEMP/fork-commit")"

          git reset --hard "$FORK_COMMIT"
          git clean -ffdx

          if [[ "$(git rev-parse HEAD)" != "$FORK_COMMIT" ]]; then
            echo "::error::Workspace does not match trusted fork"
            exit 1
          fi

          echo "✅ Workspace matches trusted fork."

      # ================================================================
      # 6. SAVE FORK-OWNED FILES
      # ================================================================

      - name: 🛡️ Save fork-owned files
        run: |
          set -euo pipefail

          SAVE_DIR="$RUNNER_TEMP/protected"

          rm -rf -- "$SAVE_DIR"
          mkdir -p -- "$SAVE_DIR"

          # ------------------------------------------------------------
          # config.toml
          # ------------------------------------------------------------

          if [[ ! -f "$PROTECTED_CONFIG" ]]; then
            echo "::error::config.toml is missing"
            exit 1
          fi

          if [[ -L "$PROTECTED_CONFIG" ]]; then
            echo "::error::config.toml is a symlink"
            exit 1
          fi

          # ------------------------------------------------------------
          # Protected workflow
          # ------------------------------------------------------------

          if [[ ! -f "$PROTECTED_WORKFLOW" ]]; then
            echo "::error::upstream-sync.yml is missing"
            exit 1
          fi

          if [[ -L "$PROTECTED_WORKFLOW" ]]; then
            echo "::error::upstream-sync.yml is a symlink"
            exit 1
          fi

          # ------------------------------------------------------------
          # Save outside workspace.
          # ------------------------------------------------------------

          cp -- \
            "$PROTECTED_CONFIG" \
            "$SAVE_DIR/config.toml"

          cp -- \
            "$PROTECTED_WORKFLOW" \
            "$SAVE_DIR/upstream-sync.yml"

          chmod 600 \
            "$SAVE_DIR/config.toml" \
            "$SAVE_DIR/upstream-sync.yml"

          echo "✅ Fork-owned files saved."

      # ================================================================
      # 7. INSPECT UPSTREAM PROTECTED PATHS
      # ================================================================

      - name: 🔎 Inspect upstream protected paths
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          for FILE in \
            "$PROTECTED_CONFIG" \
            "$PROTECTED_WORKFLOW"; do

            ENTRY="$(
              git ls-tree \
                -r \
                --full-tree \
                "$UPSTREAM_COMMIT" \
                -- "$FILE"
            )"

            if [[ -z "$ENTRY" ]]; then
              echo "ℹ️ Upstream does not contain: $FILE"
              continue
            fi

            echo "Upstream entry:"
            echo "$ENTRY"

            MODE="$(awk '{print $1}' <<< "$ENTRY")"
            TYPE="$(awk '{print $2}' <<< "$ENTRY")"

            if [[ "$TYPE" != "blob" ]]; then
              echo "::error::Protected upstream path is not a blob: $FILE"
              exit 1
            fi

            if [[ "$MODE" != "100644" && "$MODE" != "100755" ]]; then
              echo "::error::Unexpected Git mode for $FILE"
              exit 1
            fi

          done

          echo "✅ Upstream protected paths inspected."

      # ================================================================
      # 8. IMPORT EXACT UPSTREAM TREE
      # ================================================================

      - name: 📦 Import upstream tree
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"
          SAVE_DIR="$RUNNER_TEMP/protected"

          echo "Importing upstream commit:"
          echo "$UPSTREAM_COMMIT"

          # read-tree changes Git's index/worktree.
          # It does not execute upstream files.

          git read-tree \
            --reset \
            -u \
            "$UPSTREAM_COMMIT"

          # ------------------------------------------------------------
          # Remove upstream versions of protected files.
          # ------------------------------------------------------------

          rm -f -- "$PROTECTED_CONFIG"
          rm -f -- "$PROTECTED_WORKFLOW"

          # ------------------------------------------------------------
          # Make sure GitHub workflow directory exists.
          # ------------------------------------------------------------

          if [[ -e ".github" && ! -d ".github" ]]; then
            echo "::error::.github is not a directory"
            exit 1
          fi

          if [[ -L ".github" ]]; then
            echo "::error::.github is a symlink"
            exit 1
          fi

          mkdir -p ".github/workflows"

          if [[ -L ".github/workflows" ]]; then
            echo "::error::.github/workflows is a symlink"
            exit 1
          fi

          # ------------------------------------------------------------
          # Restore protected files.
          # ------------------------------------------------------------

          cp -- \
            "$SAVE_DIR/config.toml" \
            "$PROTECTED_CONFIG"

          cp -- \
            "$SAVE_DIR/upstream-sync.yml" \
            "$PROTECTED_WORKFLOW"

          echo "✅ Upstream tree imported."
          echo "✅ Protected files restored."

      # ================================================================
      # 9. REMOVE UPSTREAM WORKFLOWS
      # ================================================================

      - name: 🧱 Protect GitHub Actions boundary
        run: |
          set -euo pipefail

          WORKFLOW_DIR=".github/workflows"

          if [[ ! -d ".github" ]]; then
            mkdir -p ".github"
          fi

          if [[ -L ".github" ]]; then
            echo "::error::.github is a symlink"
            exit 1
          fi

          if [[ -e "$WORKFLOW_DIR" && ! -d "$WORKFLOW_DIR" ]]; then
            echo "::error::.github/workflows is not a directory"
            exit 1
          fi

          if [[ -L "$WORKFLOW_DIR" ]]; then
            echo "::error::.github/workflows is a symlink"
            exit 1
          fi

          mkdir -p "$WORKFLOW_DIR"

          # Remove every upstream workflow except our protected workflow.
          find "$WORKFLOW_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name "upstream-sync.yml" \
            -exec rm -rf -- {} +

          echo "Remaining workflow files:"

          find "$WORKFLOW_DIR" \
            -mindepth 1 \
            -maxdepth 1 \
            -printf '%f\n' |
            sort

          echo "✅ GitHub Actions boundary protected."

      # ================================================================
      # 10. VERIFY PROTECTED FILES
      # ================================================================

      - name: 🔐 Verify protected files
        run: |
          set -euo pipefail

          SAVE_DIR="$RUNNER_TEMP/protected"

          [[ -f "$PROTECTED_CONFIG" ]] || {
            echo "::error::config.toml is missing"
            exit 1
          }

          [[ -f "$PROTECTED_WORKFLOW" ]] || {
            echo "::error::upstream-sync.yml is missing"
            exit 1
          }

          [[ ! -L "$PROTECTED_CONFIG" ]] || {
            echo "::error::config.toml is a symlink"
            exit 1
          }

          [[ ! -L "$PROTECTED_WORKFLOW" ]] || {
            echo "::error::upstream-sync.yml is a symlink"
            exit 1
          }

          cmp -s \
            "$PROTECTED_CONFIG" \
            "$SAVE_DIR/config.toml" || {
              echo "::error::config.toml was modified"
              exit 1
            }

          cmp -s \
            "$PROTECTED_WORKFLOW" \
            "$SAVE_DIR/upstream-sync.yml" || {
              echo "::error::upstream-sync.yml was modified"
              exit 1
            }

          echo "✅ Protected files verified byte-for-byte."

      # ================================================================
      # 11. VERIFY WORKFLOW DIRECTORY
      # ================================================================

      - name: 🔎 Verify workflow boundary
        run: |
          set -euo pipefail

          WORKFLOW_DIR=".github/workflows"

          [[ -d "$WORKFLOW_DIR" ]] || {
            echo "::error::Workflow directory is missing"
            exit 1
          }

          mapfile -t WORKFLOWS < <(
            find "$WORKFLOW_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -printf '%f\n' |
              sort
          )

          if [[ "${#WORKFLOWS[@]}" -ne 1 ]]; then
            echo "::error::Unexpected workflow files detected."

            echo
            echo "Found:"

            if [[ "${#WORKFLOWS[@]}" -eq 0 ]]; then
              echo "  <none>"
            else
              printf '  %s\n' "${WORKFLOWS[@]}"
            fi

            exit 1
          fi

          if [[ "${WORKFLOWS[0]}" != "upstream-sync.yml" ]]; then
            echo "::error::Unexpected workflow: ${WORKFLOWS[0]}"
            exit 1
          fi

          [[ -f "$WORKFLOW_DIR/upstream-sync.yml" ]] || {
            echo "::error::Protected workflow missing"
            exit 1
          }

          [[ ! -L "$WORKFLOW_DIR/upstream-sync.yml" ]] || {
            echo "::error::Protected workflow is a symlink"
            exit 1
          }

          echo "✅ Only upstream-sync.yml remains."

      # ================================================================
      # 12. VERIFY IMPORTED TREE
      # ================================================================

      - name: 🧬 Verify imported tree
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          UPSTREAM_LIST="$RUNNER_TEMP/upstream-list"
          FINAL_LIST="$RUNNER_TEMP/final-list"

          # ------------------------------------------------------------
          # IMPORTANT:
          #
          # Both sides are generated with git ls-tree.
          #
          # Do NOT compare git ls-tree output with git ls-files --stage
          # output because those commands use different formats.
          # ------------------------------------------------------------

          FINAL_TREE="$(
            git write-tree
          )"

          echo "Upstream tree:"
          git rev-parse "${UPSTREAM_COMMIT}^{tree}"

          echo
          echo "Final tree:"
          echo "$FINAL_TREE"

          # ------------------------------------------------------------
          # Upstream canonical tree.
          # ------------------------------------------------------------

          git ls-tree \
            -r \
            --full-tree \
            "$UPSTREAM_COMMIT" |
            while IFS= read -r LINE; do

              PATH_NAME="${LINE#*$'\t'}"

              if [[ "$PATH_NAME" == "config.toml" ]]; then
                continue
              fi

              if [[ "$PATH_NAME" == ".github/workflows/upstream-sync.yml" ]]; then
                continue
              fi

              # Ignore upstream workflow files because this fork
              # deliberately removes them.
              if [[ "$PATH_NAME" == .github/workflows/* ]]; then
                continue
              fi

              printf '%s\n' "$LINE"

            done |
            sort > "$UPSTREAM_LIST"

          # ------------------------------------------------------------
          # Final canonical tree.
          # ------------------------------------------------------------

          git ls-tree \
            -r \
            --full-tree \
            "$FINAL_TREE" |
            while IFS= read -r LINE; do

              PATH_NAME="${LINE#*$'\t'}"

              if [[ "$PATH_NAME" == "config.toml" ]]; then
                continue
              fi

              if [[ "$PATH_NAME" == ".github/workflows/upstream-sync.yml" ]]; then
                continue
              fi

              if [[ "$PATH_NAME" == .github/workflows/* ]]; then
                continue
              fi

              printf '%s\n' "$LINE"

            done |
            sort > "$FINAL_LIST"

          # ------------------------------------------------------------
          # Compare.
          # ------------------------------------------------------------

          if ! cmp -s "$UPSTREAM_LIST" "$FINAL_LIST"; then
            echo "::error::Imported tree does not match upstream"

            echo
            echo "Differences:"
            diff -u "$UPSTREAM_LIST" "$FINAL_LIST" || true

            exit 1
          fi

          echo "✅ Non-protected upstream content matches exactly."

      # ================================================================
      # 13. STATIC VALIDATION
      # ================================================================

      - name: 🧪 Validate sync script
        run: |
          set -euo pipefail

          FILE="sync-hagezi.sh"

          [[ -f "$FILE" ]] || {
            echo "::error::sync-hagezi.sh is missing"
            exit 1
          }

          [[ ! -L "$FILE" ]] || {
            echo "::error::sync-hagezi.sh is a symlink"
            exit 1
          }

          MODE="$(
            git ls-files --stage -- "$FILE" |
            awk '{print $1}'
          )"

          if [[ "$MODE" != "100755" ]]; then
            echo "::error::sync-hagezi.sh must be executable"
            echo "::error::Detected mode: $MODE"
            exit 1
          fi

          # Syntax check only.
          # This does NOT execute the script.

          bash -n "$FILE"

          echo "✅ Bash syntax check passed."
          echo "ℹ️ Upstream script was NOT executed."

      # ================================================================
      # 14. FINAL GIT VALIDATION
      # ================================================================

      - name: 🔎 Final Git validation
        run: |
          set -euo pipefail

          FORK_COMMIT="$(cat "$RUNNER_TEMP/fork-commit")"
          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"
          EXPECTED_TREE="$(cat "$RUNNER_TEMP/upstream-tree")"

          # Check for unresolved index entries.
          if git ls-files --unmerged | grep -q .; then
            echo "::error::Unmerged Git index entries detected"
            exit 1
          fi

          # Make sure protected files exist before staging.
          [[ -f "$PROTECTED_CONFIG" ]] || {
            echo "::error::config.toml missing"
            exit 1
          }

          [[ -f "$PROTECTED_WORKFLOW" ]] || {
            echo "::error::upstream-sync.yml missing"
            exit 1
          }

          # Verify the upstream commit still points to the same tree.
          ACTUAL_TREE="$(
            git rev-parse "${UPSTREAM_COMMIT}^{tree}"
          )"

          if [[ "$ACTUAL_TREE" != "$EXPECTED_TREE" ]]; then
            echo "::error::Pinned upstream tree changed"
            exit 1
          fi

          # Check whitespace errors.
          git diff \
            --check \
            "$FORK_COMMIT" \
            -- .

          echo
          echo "=========================================="
          echo "FINAL VERIFICATION"
          echo "=========================================="
          echo
          echo "Fork commit:"
          echo "$FORK_COMMIT"
          echo
          echo "Upstream commit:"
          echo "$UPSTREAM_COMMIT"
          echo
          echo "Upstream tree:"
          echo "$EXPECTED_TREE"
          echo
          echo "Protected files:"
          echo "  $PROTECTED_CONFIG"
          echo "  $PROTECTED_WORKFLOW"
          echo
          echo "✅ Final Git validation passed."

      # ================================================================
      # 15. STAGE AND DETECT CHANGES
      # ================================================================

      - name: 🔎 Check for changes
        id: changes
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo
            echo "=========================================="
            echo "✨ NO SYNCHRONIZATION CHANGES"
            echo "=========================================="

            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo
          echo "=========================================="
          echo "📋 SYNCHRONIZATION CHANGES DETECTED"
          echo "=========================================="

          echo
          echo "Statistics:"
          git diff --cached --stat

          echo
          echo "Files:"
          git diff --cached --name-status

      # ================================================================
      # 16. COMMIT
      # ================================================================

      - name: 📝 Commit synchronization
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"

          git commit \
            -m "Sync with upstream" \
            -m "Upstream commit: ${UPSTREAM_COMMIT}"

          echo "✅ Synchronization commit created."

      # ================================================================
      # 17. PUSH SYNC BRANCH
      # ================================================================

      - name: 🚀 Push synchronization branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git push \
            --force-with-lease \
            origin \
            "HEAD:${SYNC_BRANCH}"

          echo "✅ Synchronization branch pushed."

      # ================================================================
      # 18. CREATE / UPDATE PR
      # ================================================================

      - name: 🔀 Create or update Pull Request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          FORK_COMMIT="$(cat "$RUNNER_TEMP/fork-commit")"
          UPSTREAM_COMMIT="$(cat "$RUNNER_TEMP/upstream-commit")"
          UPSTREAM_TREE="$(cat "$RUNNER_TEMP/upstream-tree")"

          EXISTING_PR="$(
            gh pr list \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --state open \
              --limit 1 \
              --json number \
              --jq '.[0].number // empty'
          )"

          PR_TITLE="🔄 Sync with upstream"

          PR_BODY="$(
            cat <<EOF
          ## 🔄 Upstream synchronization

          This pull request was generated automatically.

          ### Trusted upstream

          \`$UPSTREAM_URL\`

          ### Pinned revisions

          | Source | Revision |
          |---|---|
          | Fork | \`$FORK_COMMIT\` |
          | Upstream | \`$UPSTREAM_COMMIT\` |
          | Upstream tree | \`$UPSTREAM_TREE\` |

          ### Protected fork-owned files

          - \`config.toml\`
          - \`.github/workflows/upstream-sync.yml\`

          ### Security checks

          - Trusted upstream identity verified
          - Exact upstream commit pinned
          - Exact upstream tree pinned
          - Protected files preserved
          - Protected files verified byte-for-byte
          - Upstream workflow files removed
          - Non-protected tree verified
          - Bash syntax checked
          - Upstream script NOT executed
          - Upstream tests NOT executed
          - Upstream builds NOT executed
          - Upstream dependencies NOT installed

          ### Manual review required

          This PR is not automatically merged.
          EOF
          )"

          if [[ -n "$EXISTING_PR" ]]; then

            echo "🔄 Updating existing PR #$EXISTING_PR"

            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          else

            echo "🆕 Creating synchronization PR"

            gh pr create \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body "$PR_BODY"

          fi

          echo "✅ Pull Request ready."

      # ================================================================
      # 19. COMPLETE
      # ================================================================

      - name: ✨ Complete
        if: steps.changes.outputs.changed == 'false'
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "✨ UPSTREAM AND FORK ARE ALREADY"
          echo "✨ SYNCHRONIZED"
          echo "=========================================="
